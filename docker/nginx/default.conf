server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Kept in step with upload_max_filesize / post_max_size in docker/php/php.ini.
    # Raising one without the other produces a confusing failure: nginx rejects
    # the request with 413 before PHP ever sees it, or PHP silently discards a
    # body nginx was happy to accept.
    client_max_body_size 8M;

    # Laravel's built-in health endpoint (bootstrap/app.php sets health: '/up'),
    # used by the image HEALTHCHECK and by Dokploy/Traefik for readiness.
    #
    # Note this is NOT the app's own /health route in routes/web.php — that one
    # is the authenticated spatie/laravel-health dashboard, which runs real
    # checks and requires a session. Probing that instead would fail closed.
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built Vite assets are content-hashed, so they are safe to cache hard.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Debian's fastcgi_params sets HTTP_HOST to $host, which STRIPS the
        # port. Laravel builds redirect URLs from HTTP_HOST, so a request to
        # localhost:8080 redirects to http://localhost — port 80, where nothing
        # listens, and the browser reports a connection failure. $http_host is
        # the client's original Host header, port included. Set after the
        # include so it overrides it.
        fastcgi_param HTTP_HOST   $http_host;
        fastcgi_param SERVER_PORT $server_port;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve dotfiles, except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
