[www]
; Log worker output to the container's stderr so `docker logs` sees it.
catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically to bound any slow leak in long-running requests.
pm.max_requests = 500

; Required: the entrypoint passes configuration through the environment, and
; clear_env = yes would hide every one of those variables from the workers.
clear_env = no
