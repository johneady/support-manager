[www]
; Log worker output to the container's stderr so `docker logs` sees it.
catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null

; WHY THESE NUMBERS ARE SMALL:
;
; This image runs on a shared 2-core / 3.9GB VPS alongside seven other app
; stacks. At the previous max_children of 20, those stacks together promised
; ~9.6GB of PHP workers on a box with 3.9GB of RAM — a promise the host cannot
; keep. A traffic spike or a bot flood on two apps at once could drive the box
; into an OOM cascade that takes down the databases with it.
;
; Measured worker RSS on that host is 21-59MB, so this ceiling caps this app at
; roughly 240MB of workers. Sizing every stack this way keeps the worst case
; under the host's memory instead of over it.
;
; Per the note above: lower max_children rather than memory_limit. Hitting this
; ceiling only QUEUES requests, which degrades gracefully, whereas a worker
; killed mid-request by the OOM reaper corrupts whatever it was doing.
;
; Internal support tool with near-zero real request volume.
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Recycle workers periodically to bound any slow leak in long-running requests.
pm.max_requests = 500

; Required: the entrypoint passes configuration through the environment, and
; clear_env = yes would hide every one of those variables from the workers.
clear_env = no
