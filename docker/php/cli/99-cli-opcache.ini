; CLI-only opcache overrides.
;
; This file is NOT in /usr/local/etc/php/conf.d. It is loaded only when
; PHP_INI_SCAN_DIR names this directory, which the entrypoint does for the
; scheduler and queue roles alone (see docker/entrypoint/entrypoint.sh).
; php.ini itself has no SAPI scoping, so this indirection is what keeps the
; directive below off php-fpm.
;
; file_cache_only=1 skips shared-memory setup entirely. For a process that
; exits in under a second and is then discarded that setup is pure overhead,
; and the win is real: measured on production, a forked `schedule:run` went
; from ~819ms to ~431ms with the on-disk file_cache warm.
;
; The same directive is ~30x SLOWER for php-fpm, which is long-lived and wants
; shared memory -- it forces filesystem I/O for ~1,000 script files on every
; web request. That is exactly why this lives here and not in
; docker/php/php.ini. Never move it back.
opcache.file_cache_only = 1
