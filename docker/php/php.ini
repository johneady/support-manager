; Runtime PHP configuration for the Support Manager container.

memory_limit = 256M

max_execution_time = 60

; No file uploads exist in this application today (no Storage::disk or ->store()
; calls, no attachment model). These are kept modest deliberately: raising them
; is a decision to make alongside the code that would need it, and
; client_max_body_size in the nginx config must be raised to match.
upload_max_filesize = 8M
post_max_size = 8M

expose_php = Off

; Production opcache. validate_timestamps=0 means the code is never re-read
; from disk — correct for an immutable image, and it must stay off in any dev
; override where the source is bind-mounted.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; Raised from 20000: the application tree is ~11.7k PHP files, and with the
; CLI file_cache below holding one entry per compiled file this would sit
; uncomfortably close to the ceiling. Shared by FPM and CLI. Entries are
; created lazily, so headroom costs nothing unused.
opcache.max_accelerated_files = 32000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; config/app.php leaves the application timezone at UTC, so PHP-level date
; handling is aligned with it here.
date.timezone = UTC

; --- CLI opcache ---------------------------------------------------------
;
; The scheduler container runs `schedule:work`, which forks `schedule:run`
; every minute, which in turn forks `queue:work --stop-when-empty`. Each of
; those is a fresh short-lived process that compiles a large slice of the
; framework and application from source. Measured on the sibling pet-adoption
; stack, that cost ~819ms per boot with CPU pinned at 100% for ~8s of every
; minute.
;
; enable_cli alone makes this WORSE, not better: a short-lived process pays
; the cost of populating a shared-memory cache that is then discarded when it
; exits (measured there: 819ms -> 1271ms). The win only arrives with a
; file_cache on disk that OUTLIVES the process, so the next fork reads compiled
; opcodes instead of recompiling (measured warm: 819ms -> 431ms).
;
; file_cache_only=1 is deliberate. It skips shared-memory setup entirely, which
; is pure overhead for a process that exits in under a second, and it means
; these CLI settings cannot perturb php-fpm's own shared-memory opcache above —
; FPM is long-lived and wants SHM, so the two must not be conflated.
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 1
