version: 2

# Monthly, and ONE grouped PR per ecosystem: every PR here runs the full CI job,
# and so does every rebase Dependabot makes when a sibling PR merges -- weekly
# runs with several groups per ecosystem meant a steady stream of PRs plus a
# rebase cascade after each merge. One PR per ecosystem per month has nothing to
# cascade into.
#
# The cost of a single group: one package that breaks the build holds back the
# rest. Fix it on the branch, or `@dependabot ignore` that dependency, rather
# than splitting the group back up.
#
# Security updates are unaffected: they are raised as soon as an advisory is
# published, independently of this schedule and of these groups.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      composer:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One group for everything. That also keeps the @tiptap/* packages
      # together, which they must be: each pins an EXACT peer version of
      # @tiptap/core, so bumping one on its own fails `npm ci` with ERESOLVE.
      npm:
        patterns:
          - '*'
    # playwright is held back deliberately. Its npm version must match a
    # chromium build already in ~/.cache/ms-playwright, because the browser CDN
    # can be blocked here and the plugin refuses to run against a mismatched
    # build (1.62.0 -> chromium-1234, 1.63.0 -> a newer build not cached).
    #
    # CI is unaffected -- it runs `npx playwright install` after `npm ci` and
    # downloads whatever the installed version wants -- so an automatic bump
    # breaks LOCAL browser testing only, which is the quiet failure this avoids:
    # green CI, red laptop. Bump it by hand together with the cached browser.
    #
    # Note this must be an `ignore`, not a group `exclude-patterns`: excluding it
    # from the npm group would only stop it being BUNDLED, and Dependabot
    # would still raise a PR for it on its own.
    ignore:
      - dependency-name: playwright
      # vite-plus is held back deliberately, and must be bumped by hand
      # together with the `vite` alias. Vite+ does not run on upstream Vite:
      # package.json aliases `vite` to npm:@voidzero-dev/vite-plus-core@X, and
      # vite-plus pins that alias to its OWN exact version, with a third copy
      # in `overrides` so transitive dependents resolve the same package.
      #
      # Dependabot bumps vite-plus but cannot see that the aliased `vite` key
      # and the override are the same package under another name, so it moves
      # one of the three and leaves the rest, and `vp build` aborts with
      # "Expected @voidzero-dev/vite-plus-core@<new>, but found <old>".
      #
      # This is an `ignore` rather than a group `exclude-patterns` for the same
      # reason as playwright above: excluding it would only stop it being
      # BUNDLED, and Dependabot would still raise the PR on its own.
      #
      # To bump: set vite-plus, dependencies.vite and overrides.vite to the same
      # new version, confirm `npm view vite-plus@<v> dependencies` still bundles
      # the pinned vitest, then `npm install && npm run build`.
      - dependency-name: vite-plus
      # The aliased vite key -- npm:@voidzero-dev/vite-plus-core, not upstream
      # Vite. Ignored for the same reason: it only moves with vite-plus.
      - dependency-name: vite
      # Platform-specific optional binaries, pulled in transitively by rollup,
      # lightningcss and esbuild. Nothing depends on them directly -- they are
      # in the lockfile only because this machine is linux-x64, and npm picks a
      # different one per platform. Bumping them in isolation is pure noise: the
      # version that matters is the parent package's, which the npm group
      # already tracks.
      - dependency-name: '@rollup/rollup-*'
      - dependency-name: 'lightningcss-*'
      - dependency-name: '@esbuild/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Ungrouped, each action (checkout, setup-php, setup-node, cache, the
    # docker/* set...) arrived as its own PR and its own CI run.
    groups:
      github-actions:
        patterns:
          - '*'

  # Pinned base images in the Dockerfile (php:8.5-*, node:26-*, and the
  # dunglas/frankenphp runtime) go stale silently otherwise -- nothing else in
  # the repo reports a new patch release of the runtime the deployed image is
  # built on.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # The php, node and frankenphp base images otherwise each arrive as their
    # own PR -- and these are the PRs that DO pay the image build in
    # docker.yml, since they change the Dockerfile.
    groups:
      docker:
        patterns:
          - '*'
    ignore:
      # Node is pinned to the 26 line, matching node-version in
      # .github/workflows/ci.yml. Only MAJORS are ignored: node:26.x patch and
      # security updates still arrive. Move the major by hand, together with
      # ci.yml -- its "Check Node pins agree" step fails if the two disagree.
      - dependency-name: node
        update-types:
          - version-update:semver-major
      #
      # PHP is held to the 8.5 line: these FROM lines and php-version in
      # .github/workflows/ci.yml must name the same version, and a PR moving
      # only the Dockerfile to the next PHP would ship a runtime CI never ran.
      # Digest updates for 8.5 still arrive -- the tag has no patch level, so
      # a new digest IS the PHP patch release. Move the minor by hand,
      # together with ci.yml.
      - dependency-name: php
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      #
      # dunglas/frankenphp is the RUNTIME. Its tag, 1.13-php8.5-trixie, floats
      # over frankenphp 1.13.x and PHP 8.5.x patches, so the monthly digest PR
      # brings both -- but only while 1.13 is frankenphp's current minor.
      # Upstream stops rebuilding 1.13 once 1.14 ships, and from then on PHP
      # patches reach the runtime only through the 1.14 PR, so merge it rather
      # than letting it sit. The exact tag this replaced
      # (1.13.3-php8.5.12-trixie) froze PHP outright: Dependabot never changes
      # a tag's -php suffix (johneady/support-manager#48). Majors are held,
      # like node's.
      - dependency-name: dunglas/frankenphp
        update-types:
          - version-update:semver-major
      #
      # composer (the binary stage in the Dockerfile) is held to 2.x: a new
      # major would ride in the same group PR as the php digests, and a break
      # there would hold those back too. Move it by hand.
      - dependency-name: composer
        update-types:
          - version-update:semver-major
