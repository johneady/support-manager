# Builds the runtime image and pushes it to GHCR.
#
# WHY THIS EXISTS: the deploy host must not build this image. Compiling the PHP
# extensions is ~6 minutes of cc, and on a small VPS already running the app
# that compile competes with production for RAM -- the failure mode is an OOM
# during deploy, which BuildKit reports as the build process dying rather than
# as a step failing (no "did not complete successfully: exit code N" line), so
# it reads like a broken Dockerfile instead of an exhausted box.
#
# Building here instead means the image is immutable: the exact bytes CI built
# and tagged are what production pulls, and a redeploy re-pulls a tag rather
# than rebuilding from source against whatever upstream looks like that day.
name: Docker

on:
  # main is NOT here: ci.yml calls this workflow (workflow_call below) once its
  # checks pass on the merge commit, so main only publishes a tested commit.
  # It used to fire on the same push in parallel with ci.yml and published
  # whether or not the tests passed. v* tags stay direct -- ci.yml does not
  # run on them, so there is nothing to wait for.
  #
  # ci.yml calls this only for a release commit: the merge of a
  # release-please PR, which raised the version in
  # .release-please-manifest.json. Other merges to main publish nothing.
  # "Run workflow" builds and pushes any commit's sha image if one is ever
  # needed between releases.
  push:
    tags: ['v*']
  workflow_call:
  # Build (but never push) on PRs that touch the image, so a broken Dockerfile
  # is caught on the branch rather than at deploy time. The extension assertion
  # in the runtime stage is the point: it turns a dropped gd configure flag or
  # a missing pdo_mysql into a red PR instead of a runtime failure on a worker.
  #
  # These are the paths that change the IMAGE rather than the application: the
  # base images, the extension set, the runtime configs, and the asset build.
  # Application code (app/, config/, routes/) is deliberately NOT here even
  # though `COPY . .` puts it in the image -- ci.yml already tests it on every
  # PR, and rebuilding the image to re-run `artisan --version` would add ~10
  # minutes to every PR for no signal the test suite does not already give.
  #
  # composer.json/.lock and package.json/-lock.json are deliberately NOT here
  # either, though they used to be. Nearly every Dependabot PR changes one, so
  # each one -- and each rebase of one -- paid a 5-15 minute image build that
  # the checks in ci.yml already cover: the suite runs on the new dependencies
  # and builds the assets. A dependency that needs an extension the image lacks
  # still fails before it can ship: the release build on main runs the same
  # extension assertion, and nothing reaches GHCR unless it passes.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      # Changes the built assets, so it changes the image.
      - vite.config.js
      - .github/workflows/docker.yml
  # Lets you rebuild a tag without an empty commit -- e.g. after a base image
  # digest bump lands, or to reproduce a deploy.
  workflow_dispatch:

# Per commit on main, for the same reason as ci.yml: a release commit's
# publish must not be cancelled by the next merge.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & push
    # Same switch as ci.yml: the CI_RUNNER repository variable moves this onto
    # a self-hosted runner; unset, it runs on GitHub's hosted runner.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # The extension compile dominates; a cold cache is ~10-15 min.
    timeout-minutes: 45

    permissions:
      contents: read
      # Required for the job's GITHUB_TOKEN to push to GHCR. Without it the
      # push fails with a 403 that looks like a credentials problem.
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # All of it on main: tag-release.sh finds the release commit in the
          # history. Nothing else reads the history.
          #
          # Written as != ... && 1 || 0 on purpose. 0 is falsy in an
          # expression, so `== main && 0 || 1` evaluates to 1 on main: a
          # shallow clone, and the release would never be tagged.
          fetch-depth: ${{ github.ref != 'refs/heads/main' && 1 || 0 }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Skipped on pull_request: a fork PR's GITHUB_TOKEN is read-only, and
      # logging in is pointless when the push step below is also skipped.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A re-run of an older commit's workflow publishes its sha tag again,
      # which is harmless, but must not drag `latest` or the branch tag back
      # onto older code. Only the newest release commit (on the default
      # branch) or the branch tip (on any other) moves them.
      - name: Check this is the branch tip
        id: tip
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          current=true
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              # Only releases publish here, and a merge can land while a
              # release is still building, so the newest release commit
              # counts, not the branch tip.
              git fetch -q origin "$GITHUB_REF"
              newest="$(git log -1 --first-parent --format=%H FETCH_HEAD -- .release-please-manifest.json)"
            else
              newest="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
            fi
            if [ "$newest" != "$GITHUB_SHA" ]; then
              current=false
            fi
          fi

          latest=false
          if [ "$current" = true ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            latest=true
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Lowercased by the action: GHCR rejects an uppercase path, and
          # github.repository preserves the owner's case.
          images: ghcr.io/${{ github.repository }}
          # `latest` deliberately tracks main only. Deploy by the sha or
          # version tag, not by latest: a tag that moves under the deploy
          # target is how you end up unable to say what is running.
          # The semver patterns only apply to a v* tag pushed by hand;
          # releases get their version tags from tag-release.sh below.
          tags: |
            type=ref,event=branch,enable=${{ steps.tip.outputs.current == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.tip.outputs.latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's own layer cache. The base images are digest-pinned, so a
          # cache hit here is genuine -- with a floating tag the extension
          # layer would silently miss whenever upstream republished.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Without this the PR build produces no image at all, so the runtime
          # stage's extension assertion never runs and the PR gate is hollow.
          load: ${{ github.event_name == 'pull_request' }}

      # The image is only useful if it can actually boot Laravel. The build's
      # own assertion proves the extensions are present; this proves the
      # application inside them is wired up -- artisan resolving the container
      # catches a missing vendor copy or a stale bootstrap cache, which an
      # extension check cannot see.
      #
      # --entrypoint php is required: the image ENTRYPOINT intercepts commands
      # and exits on a missing APP_KEY, which is not set here.
      #
      # The tag to test is read from the `tags` output rather than rebuilt from
      # `github.repository`: that context preserves the owner's case, and Docker
      # rejects an uppercase reference outright ("repository name must be
      # lowercase"), which would break this step on a fork like `JohnEady/app`.
      # metadata-action already lowercases what it emits.
      #
      # The count is asserted because metadata-action sorts tags by PRIORITY
      # (semver 900, ref 600, raw 200, sha 100), not declaration order. Exactly
      # one type matches on a PR today, so taking the first line is unambiguous
      # -- but adding a tag type later would silently retarget this at a
      # different image. Failing loudly beats testing the wrong thing.
      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          count="$(printf '%s\n' "$IMAGE_TAGS" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 tag on a pull_request, got $count:"
            printf '%s\n' "$IMAGE_TAGS"
            exit 1
          fi

          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n1)"
          echo "Smoke-testing $image"
          docker run --rm --entrypoint php "$image" artisan --version

      # release-please never fires the v* tag trigger above (it tags with
      # GITHUB_TOKEN), so a release gets its version tags here, added to the
      # sha image Build and push just published. Not on other branches: a run
      # on the release-please branch must not publish a version before its PR
      # is merged.
      - name: Tag the release
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker/tag-release.sh "ghcr.io/${GITHUB_REPOSITORY,,}"

      # Nothing here deploys. This prints the IMAGE_TAG to paste into Dokploy,
      # so the value you deploy is the immutable one rather than whatever
      # `latest` happens to point at when a container next restarts.
      #
      # `latest` IS published (see the tag list above) but is deliberately not
      # what you deploy: with pull_policy: always, an unrelated restart -- OOM,
      # host reboot -- re-pulls a moving tag and can roll a container forward
      # onto a build you never chose, with nothing recording that it happened.
      # A sha tag restarts as the same bytes every time, and rolling back is
      # setting IMAGE_TAG to an earlier sha and redeploying.
      - name: Deploy instructions
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_MINOR: ${{ steps.release.outputs.minor }}
          IS_LATEST: ${{ steps.tip.outputs.latest }}
          IS_TIP: ${{ steps.tip.outputs.current }}
        run: |
          # shellcheck disable=SC2016 # the backticks below are literal markdown
          # for the job summary, not command substitution, so these printf
          # format strings are single-quoted on purpose.
          {
            printf '## Image published\n\n'
            printf 'Deploy by setting `IMAGE_TAG` in the Dokploy environment, then redeploy:\n\n'
            printf '```\nIMAGE_TAG=%s\n```\n\n' "$IMAGE_TAG"
            if [ -n "$RELEASE_VERSION" ]; then
              printf 'Release %s is now tagged `%s`' "$RELEASE_VERSION" "$RELEASE_VERSION"
              if [ -n "$RELEASE_MINOR" ]; then
                printf ', and `%s` has moved to it' "$RELEASE_MINOR"
              fi
              printf '.\n\n'
            fi
            if [ "$IS_LATEST" = true ]; then
              printf 'Also tagged `latest` — published for convenience, but prefer the sha above.\n'
            elif [ "$IS_TIP" != true ]; then
              printf 'Not tagged `latest`: a newer release or commit is on the branch.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
